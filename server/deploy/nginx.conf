# ═══════════════════════════════════════════════════════════
# Nginx — reverse proxy vers l'API Calendrier
#
# Ce fichier ne décrit QUE le HTTP (port 80).
# C'est certbot qui ajoute le bloc HTTPS, les certificats et
# la redirection — ne les écris pas à la main.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/calendrier-api
#   sudo ln -s /etc/nginx/sites-available/calendrier-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.mondomaine.fr
#
# Après certbot, ce bloc devient le bloc 443 et un second bloc
# apparaît pour rediriger le port 80 vers HTTPS. C'est normal.
# ═══════════════════════════════════════════════════════════

# Limitation de débit : protège /api/auth du bourrinage de mots de passe
limit_req_zone $binary_remote_addr zone=calendrier_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=calendrier_api:10m  rate=120r/m;

server {
    listen 80;
    listen [::]:80;

    # ⚠ Remplace par TON domaine
    server_name api.mondomaine.fr;

    # ── En-têtes de sécurité ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Taille maximale d'une synchronisation
    client_max_body_size 10m;

    access_log /var/log/nginx/calendrier-access.log;
    error_log  /var/log/nginx/calendrier-error.log;

    # Validation du certificat par Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/auth/ {
        limit_req zone=calendrier_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=calendrier_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Rien d'autre à servir ici : le site est sur GitHub Pages
    location / {
        return 404;
    }
}
