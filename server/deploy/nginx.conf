# ═══════════════════════════════════════════════════════════
# Nginx — reverse proxy HTTPS vers l'API Calendrier
#
# Installation :
#   sudo cp nginx.conf /etc/nginx/sites-available/calendrier-api
#   sudo ln -s /etc/nginx/sites-available/calendrier-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis le certificat (gratuit, renouvelé automatiquement) :
#   sudo certbot --nginx -d api.mondomaine.fr
# Certbot réécrit ce fichier pour y ajouter le bloc 443. C'est normal.
# ═══════════════════════════════════════════════════════════

# Limitation de débit : protège /api/auth du bourrinage de mots de passe
limit_req_zone $binary_remote_addr zone=calendrier_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=calendrier_api:10m  rate=120r/m;

server {
    listen 80;
    listen [::]:80;

    # ⚠ Remplace par TON domaine
    server_name api.mondomaine.fr;

    # Certbot déposera ici son jeton de validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # ⚠ Remplace par TON domaine
    server_name api.mondomaine.fr;

    # Ces trois lignes sont ajoutées/corrigées par certbot
    # ssl_certificate     /etc/letsencrypt/live/api.mondomaine.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.mondomaine.fr/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # ── En-têtes de sécurité ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Taille maximale d'une synchronisation
    client_max_body_size 10m;

    access_log /var/log/nginx/calendrier-access.log;
    error_log  /var/log/nginx/calendrier-error.log;

    location /api/auth/ {
        limit_req zone=calendrier_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=calendrier_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tout le reste : rien à servir ici, le site est sur GitHub Pages
    location / {
        return 404;
    }
}
